<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Academia de Música – Ministerio de Alabanza, Iglesia Vida Abundante. Cursos de música: teoría musical, guitarra, piano, voz, bajo y batería.">
<title>Academia de Música – Inicio</title>
<link rel="icon" href="logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@500;600;700;800&family=Instrument+Sans:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="unidad.css">
<style>
/* Inicio: usa los tokens y el header de unidad.css */
body{min-height:100vh;display:flex;flex-direction:column}
main.home{display:flex;flex-direction:column;gap:36px;flex:1;width:100%;max-width:1200px;margin:0 auto;padding:40px 48px 48px}
main.home p,main.home li{text-align:left;hyphens:manual}
main.home>section{max-width:none;margin-inline:0}
@media (max-width:760px){main.home{padding:24px 16px 36px;gap:28px}}
.h-hello h1{font-size:clamp(30px,5vw,40px);font-weight:800;letter-spacing:-.02em;line-height:1.1;color:var(--navy)}
.h-hello p{font-size:17px;color:var(--muted);margin-top:10px}
.h-h2{font-size:22px;font-weight:700;color:var(--ink)}

.stripes{background:repeating-linear-gradient(135deg,var(--cs) 0 14px,color-mix(in srgb,var(--cs) 70%,#fff) 14px 28px)}
@supports not (color:color-mix(in srgb,red,blue)){.stripes{background:var(--cs)}}
.pill{display:inline-flex;align-items:center;font-size:12px;font-weight:600;border-radius:99px;padding:3px 12px;background:var(--cs);color:var(--ct);white-space:nowrap;font-family:var(--f-body)}
.pill.st-curso{background:var(--navy-soft);color:var(--navy)}
.pill.st-nuevo{background:var(--ok-soft);color:var(--ok)}
.pill.st-pronto{background:#f0f1f4;color:var(--muted)}
.mbar{height:5px;border-radius:99px;background:#eceef4;overflow:hidden}
.mbar i{display:block;height:100%;border-radius:99px;background:var(--c)}
.mbar.v i{background:var(--violet)}

/* Continuar */
.cont{display:grid;grid-template-columns:420px minmax(0,1fr);background:var(--bg);border:1px solid var(--line);border-radius:18px;overflow:hidden}
.cont .thumb{min-height:236px}
.cont .info{padding:32px 36px;display:flex;flex-direction:column;justify-content:center;gap:14px}
.cont .row{display:flex;align-items:center;gap:12px;flex-wrap:wrap;font-size:14px;color:var(--muted)}
.cont h2{font-size:clamp(24px,3vw,30px);font-weight:700;color:var(--navy);line-height:1.15}
.cont .prog{display:flex;align-items:center;gap:12px;font-size:14px;color:var(--muted)}
.cont .prog .mbar{width:220px;flex:none}
.cont .go{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.cta{display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:13px 26px;border-radius:12px;background:var(--navy);color:#fff;font-weight:600;font-size:16px;text-decoration:none}
.cta:hover{background:var(--navy-hover)}
.cont .next{font-size:14px;color:var(--muted)}
@media (max-width:900px){.cont{grid-template-columns:minmax(0,1fr)}.cont .thumb{min-height:120px}.cont .info{padding:22px 20px}.cont .prog .mbar{width:min(220px,40vw)}}

/* Cursos */
.head{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.filters{display:flex;gap:8px;flex-wrap:wrap}
.filters button{min-height:44px;padding:6px 14px;border-radius:99px;border:1px solid var(--line);background:var(--bg);color:#3b4462;font-size:14px;cursor:pointer}
.filters button[aria-pressed="true"]{background:var(--navy);border-color:var(--navy);color:#fff;font-weight:600}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px;margin-top:18px;list-style:none;padding:0}
@media (max-width:900px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:560px){.grid{grid-template-columns:minmax(0,1fr)}}
.card{display:flex;flex-direction:column;background:var(--bg);border:1px solid var(--line);border-radius:16px;overflow:hidden;color:inherit;text-decoration:none;height:100%;padding:0;gap:0}
a.card:hover{border-color:var(--c);box-shadow:var(--lift)}
.card.soon{opacity:.7}
.card .cover{position:relative;height:120px}
.card .cover .pill{position:absolute;right:12px;bottom:12px}
.card .body{padding:16px 18px 18px;display:grid;gap:10px}
.card .nm{display:flex;align-items:center;gap:10px;font-family:var(--f-display);font-size:19px;font-weight:700;color:var(--ink)}
.card .nm::before{content:"";width:10px;height:10px;border-radius:50%;background:var(--c);flex:none}
.card .meta{font-size:14px;color:var(--muted)}
.card .lab-s{font-size:13px;color:var(--muted)}
.empty{color:var(--muted);padding:18px 0}

/* Variante «lista de rutas» (?v=lista) */
.band{background:linear-gradient(#142a57,#1e3a73);color:#fff;padding:28px 48px 32px}
.band .in{max-width:1104px;margin:0 auto;display:grid;gap:10px;justify-items:start}
.band .eyebrow{font-size:12px;font-weight:600;color:#b9a6d8;letter-spacing:.08em;text-transform:uppercase}
.band h1{font-size:clamp(24px,4vw,32px);font-weight:800;color:#fff}
.band p{font-size:15px;color:#c4cce2}
.band .cta{background:#fff;color:var(--navy);margin-top:8px}
.band .cta:hover{background:var(--navy-soft)}
@media (max-width:760px){.band{padding:22px 16px 26px}}
.routes{display:grid;gap:12px;margin-top:18px;list-style:none;padding:0}
.route{display:grid;grid-template-columns:56px minmax(0,1fr) 200px 130px;gap:18px;align-items:center;background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:16px 18px;color:inherit;text-decoration:none}
a.route:hover{border-color:var(--c)}
.route.soon{opacity:.7}
.plate{width:56px;height:56px;border-radius:12px;background:var(--cs);color:var(--c);display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:24px}
.route .nm{font-family:var(--f-display);font-size:18px;font-weight:700;color:var(--ink)}
.route .meta{font-size:14px;color:var(--muted)}
.rbtn{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:0 18px;border-radius:12px;font-weight:600;font-size:15px;border:1px solid var(--line-strong);background:var(--bg);color:var(--navy)}
.rbtn.solid{background:var(--navy);border-color:var(--navy);color:#fff}
.rbtn.off{color:var(--muted);border-style:dashed}
@media (max-width:760px){.route{grid-template-columns:56px minmax(0,1fr);gap:12px 14px}.route .mbar,.route .rbtn{grid-column:1/-1}}
</style>
</head>
<body>
<a class="skip" href="#cursos">Saltar a los cursos</a>
<header class="top" id="top"></header>
<div id="hero"></div>
<main class="home" id="inicio"></main>
<footer><div class="wrap">Ministerio de Alabanza – Iglesia Vida Abundante</div></footer>
<script src="curso.js"></script>
<script>
(function(){
const C=window.CURSO,$=s=>document.querySelector(s);
C.header('inicio');
const lista=new URLSearchParams(location.search).get('v')==='lista';
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let filter='todos';

function state(c){
  const done=c.id==='teoria'?C.done().length:0;
  const started=c.id==='teoria'&&(done>0||C.resume().started);
  return{done,total:c.units.length,started,status:!c.ready?'pronto':started?'curso':'nuevo'};
}
const STATUS={curso:'En curso',nuevo:'Nuevo',pronto:'Próximamente'};
const num=n=>String(n).padStart(2,'0');
const href=l=>`${l.unit.file}#${l.id}`;
const unitsWord=n=>`${n} ${n===1?'unidad':'unidades'}`;

function resumeInfo(){
  const r=C.resume(),l=r.lesson,t=C.courses[0];
  if(!l)return{done:true,t,href:C.units[0].file,r};
  const u=l.unit,seen=C.seenCount(u.n);
  return{t,l,u,r,seen,total:u.lessons.length,href:href(l),label:r.started?'Continuar ▸':'Empezar',next:r.next};
}

function continueCard(){
  const i=resumeInfo();
  if(i.done)return `<section class="cont course" data-hue="${i.t.hue}" style="--h:${i.t.hue}" aria-labelledby="cTitle"><div class="thumb stripes" aria-hidden="true"></div><div class="info"><div class="row"><span class="pill">${esc(i.t.name)}</span></div><h2 id="cTitle">¡Terminaste el curso!</h2><p class="meta">Puedes repasar cualquier unidad cuando quieras.</p><div class="go"><a class="cta" href="${i.href}">Repasar desde 1.1</a></div></div></section>`;
  const pct=Math.round(i.seen/i.total*100),sub=i.r.started?(i.seen?`${i.seen} de ${i.total} lecciones de esta unidad`:'Aún sin lecciones completadas en esta unidad'):'Empieza por la primera lección';
  return `<section class="cont course" data-hue="${i.t.hue}" style="--h:${i.t.hue}" aria-labelledby="cTitle"><div class="thumb stripes" aria-hidden="true"></div><div class="info">
    <div class="row"><span class="pill">${esc(i.t.name)}</span><span>Unidad ${num(i.u.n)} – ${esc(i.u.title)}</span></div>
    <h2 id="cTitle">${i.l.k} ${esc(i.l.title)}</h2>
    <div class="prog"><div class="mbar v" role="progressbar" aria-label="Avance de la unidad" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${pct}"><i style="width:${pct}%"></i></div><span>${sub}</span></div>
    <div class="go"><a class="cta" href="${i.href}">${i.label}</a>${i.next?`<span class="next">Después: ${i.next.k} ${esc(i.next.title)}</span>`:''}</div></div></section>`;
}

function courseCard(c){
  const s=state(c),pct=s.total?Math.round(s.done/s.total*100):0;
  const meta=c.ready?`${unitsWord(s.total)} – ${esc(c.meta)}`:esc(c.meta);
  const foot=c.ready?`<div class="mbar" role="progressbar" aria-label="Unidades terminadas" aria-valuemin="0" aria-valuemax="${s.total}" aria-valuenow="${s.done}"><i style="width:${pct}%"></i></div><span class="lab-s">${s.done} de ${s.total} unidades</span>`:`<span class="lab-s">Muy pronto</span>`;
  const inner=`<div class="cover stripes" aria-hidden="true"><span class="pill st-${s.status}">${STATUS[s.status]}</span></div><div class="body"><div class="nm">${esc(c.name)}</div><div class="meta">${meta}</div>${foot}</div>`;
  const attrs=`class="card course${c.ready?'':' soon'}" data-hue="${c.hue}" style="--h:${c.hue}"`;
  return c.ready?`<a ${attrs} href="${href(C.resume().lesson||{unit:C.units[0],id:C.units[0].lessons[0].id})}">${inner}</a>`:`<div ${attrs}>${inner}</div>`;
}

function routeRow(c){
  const s=state(c),pct=s.total?Math.round(s.done/s.total*100):0;
  const meta=c.ready?`${unitsWord(s.total)} – ${esc(c.meta)}`:esc(c.meta);
  const btn=!c.ready?`<span class="rbtn off">Muy pronto</span>`:`<span class="rbtn${s.started?' solid':''}">${s.started?'Continuar':'Empezar'}</span>`;
  const bar=c.ready?`<div class="mbar" role="progressbar" aria-label="Unidades terminadas" aria-valuemin="0" aria-valuemax="${s.total}" aria-valuenow="${s.done}"><i style="width:${pct}%"></i></div>`:`<div class="mbar" aria-hidden="true"></div>`;
  const inner=`<span class="plate" aria-hidden="true">${esc(c.short)}</span><div><div class="nm">${esc(c.name)}</div><div class="meta">${meta}</div></div>${bar}${btn}`;
  const attrs=`class="route course${c.ready?'':' soon'}" data-hue="${c.hue}" style="--h:${c.hue}"`;
  return c.ready?`<a ${attrs} href="${href(C.resume().lesson||{unit:C.units[0],id:C.units[0].lessons[0].id})}">${inner}</a>`:`<div ${attrs}>${inner}</div>`;
}

function visible(c){
  const s=state(c);
  return filter==='todos'||(filter==='curso'&&s.status==='curso')||(filter==='instrumentos'&&c.id!=='teoria')||(filter==='teoria'&&c.id==='teoria');
}
const FILTERS=[['todos','Todos'],['curso','En curso'],['instrumentos','Instrumentos'],['teoria','Teoría']];

function catalog(){
  const list=C.courses.filter(visible),tag=lista?'routes':'grid',card=lista?routeRow:courseCard;
  return `<section id="cursos" aria-labelledby="cursosH" style="scroll-margin-top:16px"><div class="head"><h2 class="h-h2" id="cursosH">${lista?'Rutas de aprendizaje':'Cursos'}</h2><div class="filters" role="group" aria-label="Filtrar cursos">${FILTERS.map(([k,t])=>`<button type="button" data-f="${k}" aria-pressed="${k===filter}">${t}</button>`).join('')}</div></div>${list.length?`<ul class="${tag}">${list.map(c=>`<li>${card(c)}</li>`).join('')}</ul>`:`<p class="empty">Aún no has empezado ningún curso. Elige uno para comenzar.</p>`}</section>`;
}

function render(){
  const i=resumeInfo();
  if(lista){
    $('#hero').innerHTML=i.done?`<section class="band" aria-label="Continuar"><div class="in"><p class="eyebrow">Continúa en ${esc(i.t.name)}</p><h1>¡Terminaste el curso!</h1><a class="cta" href="${i.href}">Repasar desde 1.1</a></div></section>`
      :`<section class="band" aria-label="Continuar"><div class="in"><p class="eyebrow">Continúa en ${esc(i.t.name)}</p><h1>${i.l.k} ${esc(i.l.title)}</h1><p>Unidad ${num(i.u.n)} – ${esc(i.u.title)} – lección ${i.u.lessons.findIndex(x=>x.id===i.l.id)+1} de ${i.total}</p><a class="cta" href="${i.href}">${i.label}</a></div></section>`;
    $('#inicio').innerHTML=catalog();
  }else{
    $('#inicio').innerHTML=`<div class="h-hello"><h1>Hola</h1><p>Sigue donde lo dejaste o empieza un instrumento nuevo.</p></div>${continueCard()}${catalog()}`;
  }
  document.querySelectorAll('.filters button').forEach(b=>b.onclick=()=>{filter=b.dataset.f;render();const nb=document.querySelector(`.filters [data-f="${filter}"]`);if(nb)nb.focus({preventScroll:true})});
}
render();
})();
</script>
</body>
</html>
