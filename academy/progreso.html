<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<script>try{var t=localStorage.getItem("av-tema");if(t==="claro")document.documentElement.dataset.theme="light";else if(t==="oscuro")document.documentElement.dataset.theme="dark"}catch(e){}</script>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Tu avance en la Academia de Música. El progreso se guarda en este dispositivo.">
<title>Mi progreso – Academia de Música</title>
<link rel="icon" href="logo.png">
<link rel="preload" href="fonts/instrument-sans.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/schibsted-grotesk.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="unidad.css">
<style>
body{min-height:100vh;display:flex;flex-direction:column}
main.prog{display:flex;flex-direction:column;gap:32px;flex:1;width:100%;max-width:1200px;margin:0 auto;padding:40px 48px 48px}
main.prog p,main.prog li{text-align:left;hyphens:manual}
main.prog>section{max-width:none;margin-inline:0}
@media (max-width:760px){main.prog{padding:24px 16px 36px;gap:24px}}
.prog h1{font-size:clamp(30px,5vw,40px);font-weight:800;letter-spacing:-.02em;line-height:1.1;color:var(--navy)}
.prog .sub{font-size:17px;color:var(--muted);margin-top:10px}
.p-h2{font-size:22px;font-weight:700;color:var(--ink);margin-bottom:16px}
.card-b{background:var(--bg);border:1px solid var(--line);border-radius:16px}

.sum{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px;list-style:none;margin:0;padding:0}
.sum li{padding:22px 24px;display:grid;gap:4px}
.sum b{font-family:var(--f-display);font-size:34px;font-weight:800;color:var(--navy);line-height:1.1;font-variant-numeric:tabular-nums}
.sum span{font-size:14px;color:var(--muted)}
@media (max-width:760px){.sum{grid-template-columns:minmax(0,1fr);gap:12px}}

.mine{list-style:none;margin:0;padding:0;display:grid;gap:12px}
.mrow{display:grid;grid-template-columns:48px minmax(0,1fr) 220px 110px;gap:18px;align-items:center;padding:16px 18px}
.plate{width:48px;height:48px;border-radius:12px;background:var(--cs);color:var(--c);display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:22px}
.mrow .nm{font-family:var(--f-display);font-size:18px;font-weight:700;color:var(--ink)}
.mrow .meta{font-size:14px;color:var(--muted)}
.rbar{height:6px;border-radius:99px;background:var(--track);overflow:hidden}
.rbar i{display:block;height:100%;border-radius:99px;background:var(--c)}
.go{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:0 18px;border-radius:12px;background:var(--navy);color:var(--on-navy);font-weight:600;font-size:15px;text-decoration:none}
.go:hover{background:var(--navy-hover)}
@media (max-width:760px){.mrow{grid-template-columns:48px minmax(0,1fr);gap:12px 14px}.mrow .rbar,.mrow .go{grid-column:1/-1}}

.map{padding:24px 28px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}
.chips span{display:inline-flex;align-items:center;min-height:36px;padding:0 14px;border-radius:99px;border:1px solid var(--line);font-size:14px;color:var(--muted)}
.chips span[aria-current]{background:var(--navy);border-color:var(--navy);color:var(--on-navy);font-weight:600}
.rsteps{list-style:none;margin:0;padding:0}
.step{display:grid;grid-template-columns:44px minmax(0,1fr) 180px;gap:0 14px;align-items:center;color:inherit;text-decoration:none;min-height:64px;border-radius:10px}
a.step:hover .st-t b{text-decoration:underline}
.rail{position:relative;height:100%;min-height:64px;display:grid;place-items:center}
.rail::before,.rail::after{content:"";position:absolute;left:50%;width:2px;margin-left:-1px;background:var(--line)}
.rail::before{top:0;bottom:50%}
.rail::after{top:50%;bottom:0}
li:first-child>.step .rail::before,li:last-child>.step .rail::after{display:none}
.step.ok .rail::before,.step.ok .rail::after{background:var(--ok-line)}
.step.cur .rail::before{background:var(--ok-line)}
.step.ok-prev .rail::before{background:var(--ok-line)}
.node{position:relative;z-index:1;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:var(--navy-soft);color:var(--muted);font-weight:700;font-size:14px;font-variant-numeric:tabular-nums}
.node svg.i{width:18px;height:18px}
.step.ok .node{background:var(--ok-line);color:#fff}
.step.cur .node{background:var(--violet);color:var(--on-violet);box-shadow:0 0 0 5px var(--violet-ring)}
.st-t b{display:block;font-family:var(--f-display);font-size:17px;font-weight:700;color:var(--ink)}
.st-t span{font-size:13px;color:var(--muted)}
@media (max-width:760px){.step{grid-template-columns:44px minmax(0,1fr)}.step .rbar{display:none}.map{padding:18px 14px}}

.reset{align-self:flex-start;background:none;border:0;color:var(--muted);font:inherit;font-size:15px;text-decoration:underline;text-underline-offset:3px;cursor:pointer;min-height:44px;padding:0}
.reset:hover{color:var(--err)}
</style>
</head>
<body>
<a class="skip" href="#contenido">Saltar al contenido</a>
<header class="top" id="top"></header>
<main class="prog" id="contenido">
  <div><h1>Mi progreso</h1><p class="sub">Tu avance se guarda en este dispositivo.</p></div>
  <ul class="sum" id="sum" aria-label="Resumen"></ul>
  <section aria-labelledby="mineH"><h2 class="p-h2" id="mineH">Mis cursos</h2><ul class="mine" id="mine"></ul></section>
  <section aria-labelledby="mapH"><h2 class="p-h2" id="mapH">Mapa de la ruta</h2><div class="card-b map course" data-hue="265" style="--h:265"><div class="chips" id="chips"></div><ol class="rsteps" id="rsteps"></ol></div></section>
  <button type="button" class="reset" id="reset" hidden>Borrar mi progreso</button>
</main>
<footer><div class="wrap">Ministerio de Alabanza – Iglesia Vida Abundante</div></footer>
<script src="curso.js"></script>
<script>
(function(){
const C=window.CURSO,$=s=>document.querySelector(s);
C.header('progreso');
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const tick='<svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M9.5 16.2L5.3 12l-1.4 1.4 5.6 5.6L20.1 8.4 18.7 7z"/></svg>';
const num=n=>String(n).padStart(2,'0');
const plural=(n,a,b)=>`${n} ${n===1?a:b}`;
function render(){
  const done=C.done(),units=C.units.filter(u=>u.ready),total=C.flat().length;
  const seen=units.reduce((a,u)=>a+C.seenCount(u.n),0),pct=total?Math.round(seen/total*100):0;
  $('#sum').innerHTML=[[seen,seen===1?'lección completada':'lecciones completadas'],[done.length,done.length===1?'unidad terminada':'unidades terminadas'],[pct+' %',`del curso de ${C.courses[0].name}`]].map(([n,t])=>`<li class="card-b"><b>${n}</b><span>${t}</span></li>`).join('');

  const r=C.resume(),started=r.started||seen>0;
  $('#mine').innerHTML=C.courses.filter(c=>c.ready).map(c=>{
    const l=r.lesson,href=l?`${l.unit.file}#${l.id}`:C.units[0].file,sig=l?`${started?'Sigue':'Empieza'}: ${l.k} ${esc(l.title)}`:'Curso terminado – puedes repasar cuando quieras',p=Math.round(done.length/c.units.length*100);
    return `<li class="card-b mrow course" data-hue="${c.hue}" style="--h:${c.hue}"><span class="plate" aria-hidden="true">${esc(c.short)}</span><div><div class="nm">${esc(c.name)}</div><div class="meta">${sig}</div></div><div class="rbar" role="progressbar" aria-label="Unidades terminadas de ${esc(c.name)}" aria-valuemin="0" aria-valuemax="${c.units.length}" aria-valuenow="${done.length}"><i style="width:${p}%"></i></div><a class="go" href="${href}">${started?'Continuar':'Empezar'}</a></li>`}).join('');

  $('#chips').innerHTML=C.courses.map((c,i)=>`<span${i===0?' aria-current="true"':''}>${esc(c.name)}</span>`).join('');
  const curN=r.lesson?r.lesson.u:null;
  $('#rsteps').innerHTML=units.map((u,i)=>{
    const d=done.includes(u.n),cur=!d&&u.n===curN&&started,s=C.seenCount(u.n),p=Math.round(s/u.lessons.length*100);
    const st=d?`${u.lessons.length} de ${u.lessons.length} lecciones – terminada`:cur||s?`${s} de ${u.lessons.length} lecciones – en curso`:`${u.lessons.length} lecciones`;
    const prevOk=i>0&&done.includes(units[i-1].n);
    const inner=`<span class="rail"><span class="node">${d?tick:num(u.n)}</span></span><span class="st-t"><b>Unidad ${num(u.n)} – ${esc(u.title)}</b><span>${st}</span></span><span class="rbar" aria-hidden="true"><i style="width:${d?100:p}%"></i></span>`;
    return `<li><a class="step${d?' ok':''}${cur?' cur':''}${prevOk?' ok-prev':''}" href="${u.file}"${cur?' aria-current="step"':''}>${inner}</a></li>`}).join('');
  $('#reset').hidden=!(seen||done.length);
}
$('#reset').onclick=()=>{if(confirm('¿Borrar tu progreso en este dispositivo? Se quitarán las lecciones y unidades marcadas como completadas.')){C.reset();render()}};
render();
})();
</script>
</body>
</html>
